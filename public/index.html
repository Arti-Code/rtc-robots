<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Robotics</title>
    <script src="index.js"></script>
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="logo">
                <img src="./title.png" height="96">
        </div>

        <div class="container" id="inputBox">
                <div class="container_row">
                        <input type="text" id="userName" value="ARTUR">
                        <input type="text" id="targetName" value="ROBOT">
                </div>
        </div>

        <div class="container">
                <div class="container_row">
                        <button id="startButton" class="button btn_connect" onclick="tryConnect()">Connect</button>
                        <button id="cameraButton" class="button btn_connect" onclick="tryConnectCamera()">Camera</button>
                        <button id="stopButton" class="button btn_disconnect" onclick="disconnect()" hidden>Disconnect</button>
                </div>
        </div>
        
        <div class="container">

                <div class="column">
                        <div id="rightButton", class="cell" onclick="move('RIGHT')">
                                <img src="./arrow_right.png" width="72">
                        </div>
                        <div id="leftButton", class="cell" onclick="move('LEFT')">
                                <img src="./arrow_left.png" width="72">
                        </div>
                </div>
        
        
                <div class="column">
                        <video id="remoteVideos" class="video"></video>
                </div>
        
                <div class="column">
                        <div id="moveButton", class="cell"> <!--  onclick="move('MOVE')"> -->
                                <img src="./arrow_move.png" width="72">
                        </div>
                        <div id="backButton", class="cell" onclick="move('BACK')">
                                <img src="./arrow_back.png" width="72">
                        </div>
                </div>

        </div>

    <div class="container_log" id="messages">
    </div>
</body>
</html>
