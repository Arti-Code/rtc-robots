<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Robotics</title>
    <script src="index.js"></script>
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <!-- <div class="logo">
                <img src="./title.png" height="96">
        </div> -->

        <!-- <div class="container">
                <div class="container_row">
                        <button id="socketButton" class="button btn_connect" onclick="connect_websocket()">Connect</button>
                        <button id="socketDisconnectButton" class="button btn_disconnect" onclick="disconnect_websocket()" hidden>Disconnect</button>
                </div>
        </div> -->

        <div id="websocket_section">
                <div class="container">
                        <div class="container_row">
                                <input type="text" id="userName" value="ARTURO">
                                <button id="socketButton" class="button btn_connect" onclick="connect_websocket()">Connect Signaling</button>
                        </div>
                </div>
        </div>

        <div id="rtc_section" hidden>
                <div class="container">
                        <div class="container_row">
                                <input type="text" id="robotTarget" value="ROBOT">
                                <input type="text" id="cameraTarget" value="CAMERA">
                        </div>
                        <div class="container_row">
                                <button id="startButton" class="button btn_connect" onclick="connectRobot()">Connect Robot</button>
                        </div>
                </div>
        </div>

        <div class="container">
                <div class="container_row">
                        <img src="./robot.png" height="96">
                        <button id="socketButton" class="button btn_connect" onclick="connect_websocket()">Connect</button>
                        <button id="socketDisconnectButton" class="button btn_disconnect" onclick="disconnect_websocket()" hidden>Disconnect</button>
                        <button id="startButton" class="button btn_connect" onclick="connectRobot()">Connect</button>
                        <!-- <button id="cameraButton" class="button btn_connect" onclick="tryConnectCamera()">Camera</button> -->
                        <button id="stopButton" class="button btn_disconnect" onclick="disconnectRobot()" hidden>Disconnect</button>
                </div>
        </div>

        <!-- <div class="container" id="inputBox">
                <div class="container_row">
                        <input type="text" id="user1Name" value="ARTUR">
                </div>
        </div> -->
        
        <div class="container" id="inputBox">
                <div class="container_row">
                        <input type="text" id="robotTarget" value="ROBOT">
                        <input type="text" id="cameraTarget" value="CAMERA">
                </div>
        </div>

        <div class="container">

                <div class="column">
                        <div id="rightButton", class="cell" onclick="move('RIGHT')">
                                <img src="./arrow_right.png" width="72">
                        </div>
                        <div id="leftButton", class="cell" onclick="move('LEFT')">
                                <img src="./arrow_left.png" width="72">
                        </div>
                </div>
        
        
                <div class="column">
                        <video id="remoteVideos" class="video"></video>
                </div>
        
                <div class="column">
                        <div id="moveButton", class="cell" onclick="move('MOVE')">
                                <img src="./arrow_move.png" width="72">
                        </div>
                        <div id="backButton", class="cell" onclick="move('BACK')">
                                <img src="./arrow_back.png" width="72">
                        </div>
                </div>

        </div>

    <div class="container_log" id="messages">
    </div>
</body>
</html>
