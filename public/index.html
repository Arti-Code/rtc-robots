<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Robotics</title>
    <script src="index.js"></script>
    <link rel="icon" type="image/x-icon" href="./favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="logo">
                <img src="./title.png" height="96">
        </div>
        <div class="container">

                <div class="container_row">
                        <input id="userName" value="ARTUR"></div>
                        <input id="targetName" value="ROBOT"></div>
                </div>
                <div class="container_row">
                        <button id="startButton" class="button" onclick="tryConnect()">Connect</button>
                        <button id="stopButton" class="button" onclick="disconnect()" disabled>Disconnect</button>
                </div>
        </div>
        
        <div class="container">

                <div class="column">
                        <div class="cell border control_div" onclick="move('RIGHT')">
                                <img src="./arrow_right.png" width="72">
                                <!-- <div id="right" class="button control_div" disabled onclick="move('RIGHT')">RIGHT</div> -->
                        </div>
                        <div class="cell border control_div" onclick="move('LEFT')">
                                <img src="./arrow_left.png" width="72">
                                <!-- <div id="left" class="button control_div" disabled onclick="move('LEFT')">LEFT</div> -->
                        </div>
                </div>
        
        
                <div class="column">
                        <div class="video"></div>
                </div>
        
                <div class="column">
                        <div class="cell border control_div" onclick="move('MOVE')">
                                <img src="./arrow_move.png" width="72">
                                <!-- <div id="move" class="button control_div" disabled onclick="move('FORWARD')">MOVE</div> -->
                        </div>
                        <div class="cell border control_div" onclick="move('BACK')">
                                <img src="./arrow_back.png" width="72">
                                <!-- <div id="back" class="button control_div" disabled onclick="move('BACK')">BACK</div> -->
                        </div>
                </div>

        </div>

    <div class="container_log" id="messages">
    </div>
</body>
</html>
